          chance: 0.8
          display-name: ""
          on-pickup-actions: []
        - item: "PAPER"
          amount: 1
          chance: 1.0
          display-name: "&a采矿经验卷轴"
          on-pickup-actions:
            - "tell color *&a+10 采矿经验"
            - "actionbar color *&e采矿经验 +10"
      kether-actions:
        - "tell color *&a你成功采集了铁矿石！"
